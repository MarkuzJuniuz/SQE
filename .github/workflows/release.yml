# Builds SQE on a Windows runner and publishes SQE_vX.Y.Z.zip as a GitHub Release.
# Trigger: push a tag that matches sqe/__init__.py __version__, e.g.
#   git tag v0.10.0
#   git push origin v0.10.0
# "Run workflow" on the Actions tab builds without releasing (zip shows up as a build artifact).

name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read only by default; the one job asks for write because it publishes the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    # Actions are pinned to a full commit (the version in the comment), so a moved tag cannot change what runs here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'  # was '3.13' until 2026-11-09; roll back here if the 3.14 build fails

      - name: Read version
        id: ver
        shell: pwsh
        # The ref comes in as environment variables, never pasted into the script text: a tag name is outside input.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path sqe/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            Write-Error "Tag $env:REF_NAME does not match __version__ $v"
            exit 1
          }

      - name: Build
        shell: cmd
        run: build_exe.bat

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/SQE -DestinationPath "SQE_v${{ steps.ver.outputs.version }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: SQE_v${{ steps.ver.outputs.version }}
          path: SQE_v${{ steps.ver.outputs.version }}.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: SQE_v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
