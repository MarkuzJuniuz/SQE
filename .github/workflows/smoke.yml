# Runs the headless smoke test (tools/smoke_test.py, about a minute) on every pull request and on pushes to main.
# PySide6 is installed (some checks build the dialogs offscreen), with the system libraries Qt needs on a headless runner.
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt system libraries (headless)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: "Install (requirements.txt: the pinned pydcs fork, PySide6, Pillow)"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python tools/smoke_test.py 2>&1 | tee smoke.log || { tail -n 25 smoke.log | sed 's/^/::error::/'; exit 1; }
